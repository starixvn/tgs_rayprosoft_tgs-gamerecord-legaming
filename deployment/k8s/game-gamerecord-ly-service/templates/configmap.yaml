apiVersion: v1
kind: ConfigMap
metadata:
  name: configmap-{{ include "game-gamerecord-ly-service.name" . }}
  namespace: {{ .Values.namespace }}
data:
  appsettings.json: |
    {
      "GameRecordInfo": {
        "GameProviderCode": "LY",
        "GameProviderConfiguration": "LYConfiguration",
        "IntervalMinutes": 5,
        "IntervalMinutesMax": 30,
        "IntervalMinutesMinimum": 3
      },
      "GameRecord": {
        "GameRecordSchedulesBaseUrl": "http://game-gamerecordschedules:9090/",
        "GameCommandClientBaseUrl": "http://game-gamecommand/",
        "GameProvidersBaseUrl": "http://game-gameproviders/"
      }
    }
  monitor.settings.json: |
    {
      "Metrics": {
        "MetricCount": "1"
      },
      "Logging":{
        "Console": {
          "FormatterName": "json"
        },
        "LogLevel": {
          "Default": "Warning",
          "Microsoft": "Warning",
          "Microsoft.Diagnostics": "Warning",
          "Microsoft.Hosting.Lifetime": "Information"
        }
      }
    }
